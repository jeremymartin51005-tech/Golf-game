<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Next-Gen Golf</title>
<style>
  :root { --ink:#f3f6f1; --dim:#b9c4b8; --panel:rgba(14,24,18,.78); --line:rgba(255,255,255,.14); --accent:#e8c65a; --good:#7fd08a; --bad:#ef7d6b; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#0d1711; color:var(--ink); font:15px/1.4 "Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif; overflow:hidden; user-select:none; }
  canvas#view { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .hud { position:fixed; pointer-events:none; text-shadow:0 1px 2px rgba(0,0,0,.6); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 14px; backdrop-filter:blur(6px); }
  #hudHole { top:14px; left:14px; min-width:190px; }
  #hudHole .big { font-size:22px; font-weight:600; letter-spacing:.2px; }
  #hudWind { top:14px; right:14px; text-align:center; width:120px; }
  #windArrow { width:54px; height:54px; margin:2px auto; transition:transform .25s; }
  #hudShot { bottom:14px; left:14px; min-width:270px; }
  #hudShot .club { padding-right:52px; }
  #hudShot .club { font-size:20px; font-weight:600; }
  #hudShot .row { display:flex; justify-content:space-between; gap:18px; color:var(--dim); }
  #hudShot .row b { color:var(--ink); font-weight:600; }
  #hudHelp { bottom:14px; right:14px; color:var(--dim); font-size:12.5px; max-width:340px; text-align:right; }
  #hudHelp kbd { background:rgba(255,255,255,.14); border-radius:4px; padding:0 5px; color:var(--ink); font:inherit; }
  /* Swing gauge: one vertical capsule on the right. */
  #meter { right:46px; top:50%; transform:translateY(-38%); width:150px; height:340px; }
  #mPrompt { position:absolute; right:0; top:-62px; width:280px; text-align:right; font-weight:700; font-size:17px; letter-spacing:.3px; transition:opacity .2s; }
  #mPrompt small { display:block; font-weight:400; font-size:12px; color:var(--dim); white-space:nowrap; }
  #mCap { position:absolute; right:0; top:0; width:30px; height:280px; border-radius:15px; background:rgba(8,16,11,.62); border:1px solid rgba(255,255,255,.22); box-shadow:0 6px 24px rgba(0,0,0,.35), inset 0 0 0 3px rgba(0,0,0,.25); overflow:hidden; }
  #mOver { position:absolute; left:0; right:0; top:0; height:9.1%; background:repeating-linear-gradient(135deg, rgba(239,93,72,.55) 0 5px, rgba(239,93,72,.25) 5px 10px); }
  #mFill { position:absolute; left:4px; right:4px; bottom:4px; height:0; border-radius:11px; background:linear-gradient(0deg, #f6f6ee 0%, #ffe28a 70%, #ffc94a 100%); box-shadow:0 0 14px rgba(255,214,102,.65); }
  #mFill.over { background:linear-gradient(0deg, #f6f6ee 0%, #ff9a7a 75%, #ef5d48 100%); box-shadow:0 0 16px rgba(239,93,72,.8); }
  #mZone { position:absolute; left:-1px; right:-1px; height:14px; border:2px solid #6ff09a; border-radius:8px; box-shadow:0 0 12px rgba(111,240,154,.8), inset 0 0 8px rgba(111,240,154,.5); transition:bottom .25s ease; }
  #mZone.hit { background:rgba(111,240,154,.35); }
  .mTick { position:absolute; left:0; width:8px; height:2px; background:rgba(255,255,255,.4); }
  #mCarry { position:absolute; right:40px; width:110px; text-align:right; font-weight:700; font-size:15px; text-shadow:0 1px 3px rgba(0,0,0,.8); transform:translateY(50%); white-space:nowrap; }
  #mCarry small { font-weight:400; color:var(--dim); font-size:11px; display:block; }
  #mZoneLbl { position:absolute; right:40px; font-size:11px; font-weight:700; color:#6ff09a; letter-spacing:.8px; transform:translateY(50%); transition:bottom .25s ease; }
  #mTempo { position:absolute; right:-10px; top:292px; width:150px; height:8px; border-radius:4px; background:linear-gradient(90deg, rgba(239,93,72,.75), rgba(255,214,102,.75) 30%, #6ff09a 42% 58%, rgba(255,214,102,.75) 70%, rgba(239,93,72,.75)); opacity:.9; }
  #mTempoDot { position:absolute; top:-5px; width:14px; height:14px; margin-left:-7px; border-radius:7px; background:#fff; box-shadow:0 0 0 3px rgba(0,0,0,.4); left:50%; transition:left .35s cubic-bezier(.2,.9,.3,1.2), opacity .2s; }
  #mTempoLbl { position:absolute; right:-10px; top:304px; width:150px; display:flex; justify-content:space-between; font-size:10.5px; color:var(--dim); letter-spacing:.6px; }
  #mGrade { position:absolute; right:-14px; top:326px; min-width:120px; padding:5px 12px; border-radius:16px; text-align:center; font-weight:800; font-size:15px; letter-spacing:1.4px; color:#10170f; background:#6ff09a; transform:scale(0); transition:transform .3s cubic-bezier(.2,1.6,.4,1); }
  #mGrade.show { transform:scale(1); }
  #mPath { position:absolute; right:42px; top:252px; width:26px; height:26px; opacity:.85; transition:transform .3s ease; }
  #hudHelp .more { display:none; }
  #hudHelp.full .more { display:block; }
  #result { top:22%; left:50%; transform:translateX(-50%); min-width:320px; max-width:460px; text-align:center; display:none; }
  #result h2 { margin:0 0 2px; font-size:26px; }
  #result .nums { font-size:17px; margin-bottom:6px; }
  #result .why { color:var(--dim); font-size:13.5px; text-align:left; margin:6px 0 0; padding-left:18px; }
  #result .adv { color:var(--dim); font-size:12px; margin-top:8px; border-top:1px solid var(--line); padding-top:6px; }
  #banner { top:38%; left:50%; transform:translate(-50%,-50%); font-size:44px; font-weight:700; letter-spacing:1px; display:none; text-align:center; }
  #banner small { display:block; font-size:17px; font-weight:400; color:var(--dim); letter-spacing:0; }
  #fps { top:14px; left:50%; transform:translateX(-50%); font:12px ui-monospace,Consolas,monospace; color:#dfe; display:none; }
  .overlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(8,14,10,.72); z-index:10; }
  .overlay.show { display:flex; }
  .menu { width:min(560px,92vw); max-height:92vh; overflow:auto; background:rgba(16,28,20,.94); border:1px solid var(--line); border-radius:14px; padding:26px 28px; }
  .menu h1 { margin:0; font-size:34px; letter-spacing:.5px; }
  .menu h2 { margin:0 0 12px; font-size:22px; }
  .menu p.sub { margin:4px 0 18px; color:var(--dim); }
  .menu button { display:block; width:100%; margin:8px 0; padding:12px 14px; font:inherit; font-size:16px; color:var(--ink); background:rgba(255,255,255,.07); border:1px solid var(--line); border-radius:9px; cursor:pointer; text-align:left; }
  .menu button:hover, .menu button:focus { background:rgba(232,198,90,.18); border-color:var(--accent); outline:none; }
  .menu button small { display:block; color:var(--dim); font-size:12.5px; }
  .menu button.primary { background:var(--accent); color:#1a1a10; font-weight:600; text-align:center; border-color:var(--accent); }
  .menu label { display:flex; justify-content:space-between; align-items:center; gap:14px; margin:10px 0; }
  .menu select, .menu input[type=text] { font:inherit; color:var(--ink); background:#1c2c22; border:1px solid var(--line); border-radius:7px; padding:6px 8px; min-width:180px; }
  .menu input[type=range] { width:180px; }
  .menu .note { color:var(--dim); font-size:12.5px; }
  .menu .err { color:var(--bad); min-height:18px; font-size:13px; }
  table.sc { border-collapse:collapse; width:100%; margin:10px 0; font-variant-numeric:tabular-nums; }
  table.sc th, table.sc td { border:1px solid var(--line); padding:5px 0; text-align:center; min-width:30px; }
  table.sc th { color:var(--dim); font-weight:500; }
  table.sc td.under { color:var(--good); font-weight:700; } table.sc td.over { color:var(--bad); }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:4px 18px; color:var(--dim); margin:8px 0 14px; }
  .stats b { color:var(--ink); float:right; }
  #loading { z-index:20; background:#0d1711; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="vignette" style="position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.28) 100%)"></div>

<div id="hudHole" class="hud card" style="display:none"><div class="big" id="hHole"></div><div id="hScore"></div><div id="hCourse" style="color:var(--dim);font-size:12.5px"></div></div>
<div id="hudWind" class="hud card" style="display:none">
  <svg id="windArrow" viewBox="-30 -30 60 60"><circle r="27" fill="none" stroke="rgba(255,255,255,.25)"/><path d="M0,-20 L9,2 L3,2 L3,20 L-3,20 L-3,2 L-9,2 Z" fill="#fff"/></svg>
  <div id="hWind"></div>
</div>
<div id="hudShot" class="hud card" style="display:none">
  <div class="club" id="hClub"></div>
  <div class="row"><span>To pin</span><b id="hDist"></b></div>
  <div class="row"><span>Lie</span><b id="hLie"></b></div>
  <div class="row"><span>Shot</span><b id="hType"></b></div>
  <div class="row"><span>Shape</span><b id="hShape"></b></div>
  <div class="row" style="align-items:center"><span>Spin</span><b id="hSpin"></b></div>
  <svg id="strike" viewBox="0 0 40 40" width="46" height="46" style="position:absolute;right:12px;top:10px">
    <defs><radialGradient id="ballg" cx="40%" cy="35%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#c9cdd2"/></radialGradient></defs>
    <circle cx="20" cy="20" r="17" fill="url(#ballg)" stroke="rgba(0,0,0,.35)"/>
    <line x1="20" y1="5" x2="20" y2="35" stroke="rgba(0,0,0,.15)"/><line x1="5" y1="20" x2="35" y2="20" stroke="rgba(0,0,0,.15)"/>
    <circle id="strikeDot" cx="20" cy="20" r="4" fill="#d8342a"/>
  </svg>
</div>
<div id="hudHelp" class="hud"></div>
<div id="meter" class="hud" style="display:none">
  <div id="mPrompt"></div>
  <div id="mCap"><div id="mOver"></div><div class="mTick" style="bottom:25%"></div><div class="mTick" style="bottom:50%"></div><div class="mTick" style="bottom:75%"></div><div id="mFill"></div><div id="mZone"></div></div>
  <div id="mZoneLbl">PERFECT</div>
  <div id="mCarry"></div>
  <svg id="mPath" viewBox="-13 -13 26 26"><circle r="12" fill="rgba(8,16,11,.6)" stroke="rgba(255,255,255,.25)"/><path d="M0,8 L0,-7 M-4,-3 L0,-8 L4,-3" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
  <div id="mTempo"><div id="mTempoDot"></div></div>
  <div id="mTempoLbl"><span>FAST</span><span>TEMPO</span><span>SLOW</span></div>
  <div id="mGrade"></div>
</div>
</div>
<div id="result" class="hud card"></div>
<div id="banner" class="hud"></div>
<div id="fps" class="hud"></div>

<div id="loading" class="overlay show"><div class="menu" style="text-align:center"><h1>Next-Gen Golf</h1><p class="sub" id="loadText">Loading…</p></div></div>
<div id="ui" class="overlay"><div class="menu" id="uiBody"></div></div>

<script>/*__THREE__*/</script>
<script>/*__EXTRA__*/</script>
<script>window.GOLF_WASM_B64 = "/*__WASM__*/";</script>
<script>/*__GAME__*/</script>
</body>
</html>
